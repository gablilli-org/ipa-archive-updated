name: Generate Repo JSON

on:
  workflow_dispatch:
  push:
    paths:
      - 'data/**'
      - 'generate_repo_json.py'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: Run script
        run: python generate_repo_json.py
      
      - name: Push changes
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Update repo.json" || echo "No changes"
          git push --force
